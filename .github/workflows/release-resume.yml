name: Build and Release Resume
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PT Serif Font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -L "https://fonts.google.com/download?family=PT%20Serif" -o pt-serif.zip
          unzip pt-serif.zip -d ~/.local/share/fonts
          fc-cache -f -v

      - name: Install Typst
        uses: chataigne/setup-typst@v1

      - name: Compile Resume
        # We move into the directory or point to the file path
        # Assuming resume_AriCholakin.typ is your main file
        run: |
          typst compile imprecv/resume_AriCholakin.typ resume_AriCholakin.pdf --font-path ~/.local/share/fonts

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resume Build
          files: resume_AriCholakin.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}